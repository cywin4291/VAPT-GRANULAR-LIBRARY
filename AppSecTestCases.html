        function getTemplates(catName, subName) {
            const catLower = catName.toLowerCase();
            if (catLower.includes('cross-site scripting') || catLower.includes('xss')) {
                return {
                    desc: `Testing for ${subName}, evaluating if the application securely handles untrusted data in client-side contexts to prevent arbitrary script execution.`,
                    loc: "Input fields, URL parameters, file uploads, JSON responses, and HTTP headers.",
                    burp: `1. Intercept the target HTTP request in Burp Proxy.\n2. Send to Repeater/Intruder.\n3. Inject polyglot or context-specific payloads for ${subName}.\n4. Observe if the payload is reflected or executed unescaped in the browser/DOM.`,
                    rem: "Implement strict context-aware output encoding. Use Content Security Policy (CSP). Avoid using dangerous DOM sinks like innerHTML."
                };
            } else if (catLower.includes('csrf')) {
                return {
                    desc: `Testing for ${subName} to verify if attackers can force an authenticated user to perform state-changing actions without their consent.`,
                    loc: "State-changing endpoints (POST/PUT/DELETE), account settings, payment gateways, and profile updates.",
                    burp: `1. Capture the state-changing request.\n2. Right-click > Engagement tools > Generate CSRF PoC.\n3. Modify or drop tokens to test ${subName} bypass.\n4. Execute the PoC in an authenticated victim's browser session.`,
                    rem: "Implement unpredictable, session-bound Anti-CSRF tokens. Use SameSite=Lax/Strict cookie attributes. Enforce re-authentication for critical actions."
                };
            } else if (catLower.includes('injection')) {
                return {
                    desc: `Testing for ${subName} by injecting crafted characters or syntax to manipulate backend interpreters, databases, or parsers.`,
                    loc: "Search fields, login forms, numeric IDs in URLs, API JSON payloads, and HTTP headers.",
                    burp: `1. Map all inputs and send to Repeater.\n2. Fuzz parameters using syntax relevant to ${subName} (e.g., ', ", ;, |, {{}}).\n3. Analyze responses for database errors, time delays (sleep payloads), or unintended logic bypasses.`,
                    rem: "Use parameterized queries (Prepared Statements), safe API libraries, and enforce strict positive server-side input validation."
                };
            } else if (catLower.includes('authentication') || catLower.includes('session')) {
                return {
                    desc: `Auditing the implementation for ${subName} to ensure attackers cannot bypass identity verification or hijack user sessions.`,
                    loc: "Login forms, password reset endpoints, MFA flows, session cookies, and authorization headers.",
                    burp: `1. Map the authentication/session flow.\n2. Test for ${subName} by manipulating parameters (e.g., success:true), enumerating users, or capturing/reusing session tokens.\n3. Send requests without valid tokens to verify enforcement.`,
                    rem: "Enforce strong password policies, multi-factor authentication, secure session generation (high entropy), and strict timeout/invalidation controls."
                };
            } else if (catLower.includes('authorization') || catLower.includes('access control') || catLower.includes('bola')) {
                return {
                    desc: `Evaluating the endpoint for ${subName} to determine if a user can access or modify resources belonging to other users or higher privileged roles.`,
                    loc: "API identifiers (e.g., /api/user/123), admin panels, direct file downloads, and property modification payloads.",
                    burp: `1. Create two test accounts (User A, User B).\n2. Intercept a request for User A's resource.\n3. Modify the identifier/parameter to access User B's resource (testing ${subName}).\n4. Test accessing admin routes with standard user tokens.`,
                    rem: "Implement robust server-side authorization checks on every request. Map user roles to resources securely. Use unguessable identifiers (UUIDv4)."
                };
            } else if (catLower.includes('business logic') || catLower.includes('exceptional') || catLower.includes('race')) {
                return {
                    desc: `Testing for ${subName} to identify flaws in the application's workflow, state transitions, or concurrent request handling.`,
                    loc: "Shopping carts, payment flows, coupon applications, multi-step wizards, and transactional endpoints.",
                    burp: `1. Intercept sequential workflow requests.\n2. Test ${subName} by skipping steps, sending negative quantities, or tampering with prices.\n3. For race conditions, use Intruder to send max concurrent requests simultaneously.`,
                    rem: "Enforce strict state validation server-side. Do not trust client-supplied prices/quantities. Implement pessimistic/optimistic database locks for concurrent actions."
                };
            } else if (catLower.includes('upload') || catLower.includes('traversal') || catLower.includes('file')) {
                return {
                    desc: `Testing for ${subName} to ensure the application securely handles file system interactions and file uploads.`,
                    loc: "Profile picture uploads, document imports, file download parameters (e.g., ?file=), and template loaders.",
                    burp: `1. Intercept the file upload/download request.\n2. For uploads, attempt extension/MIME bypasses (e.g., shell.php.jpg).\n3. For traversal (${subName}), inject payload variations like ../../../../etc/passwd and check response.`,
                    rem: "Use strict allowlists for file extensions and MIME types. Validate magic bytes. Do not pass user input directly to filesystem APIs (use indirect referencing)."
                };
            } else if (catLower.includes('api') || catLower.includes('graphql') || catLower.includes('websocket')) {
                return {
                    desc: `Auditing the interface for ${subName} to identify vulnerabilities specific to modern API, GraphQL, or WebSocket implementations.`,
                    loc: "RESTful endpoints (/api/v1/), GraphQL endpoints (/graphql), and WebSocket handshakes (ws://).",
                    burp: `1. Map the API schema or WebSocket frames.\n2. Test ${subName} by performing introspection, manipulating JSON object properties (Mass Assignment), or fuzzing unlisted endpoints.\n3. Analyze responses for excessive data exposure.`,
                    rem: "Disable introspection in production. Filter API responses server-side to prevent data leakage. Explicitly define allowed properties for updates."
                };
            } else {
                return {
                    desc: `Performing targeted verification for ${subName} within the ${catName} domain to identify potential security weaknesses.`,
                    loc: "Relevant endpoints, parameters, headers, or infrastructure configurations mapped to this domain.",
                    burp: `1. Identify parameters or workflows relevant to ${subName}.\n2. Intercept traffic using Burp Proxy.\n3. Manipulate the input or request state to violate expected security constraints.\n4. Analyze the application's response or behavior.`,
                    rem: "Follow secure coding guidelines, enforce strict input validation, implement least privilege, and ensure secure default configurations."
                };
            }
        }

        // Parse Raw Text
        const rawText = document.getElementById('rawDataBlock').textContent.trim();
        const lines = rawText.split('\n');
        
        const groupedData = {};
        let currentCategory = null;
        let idCounter = 0;
        let totalItems = 0;

        lines.forEach(line => {
            line = line.trim();
            if (!line || line.startsWith("OWASP") || line.startsWith("This is particularly") || line.startsWith("Keep this")) return;

            const catMatch = line.match(/^(\d+)\.\s*(.*)/);
            if (catMatch) {
                currentCategory = catMatch[0];
                groupedData[currentCategory] = [];
            } else if (currentCategory) {
                const templates = getTemplates(currentCategory, line);
                groupedData[currentCategory].push({
                    id: idCounter++,
                    category: currentCategory,
                    sub_name: line,
                    description: templates.desc,
                    location: templates.loc,
                    burp: templates.burp,
                    remediation: templates.rem,
                    searchStr: (line + " " + currentCategory).toLowerCase()
                });
                totalItems++;
            }
        });

        // Build UI
        const sidebarList = document.getElementById('sidebarList');
        const searchInput = document.getElementById('masterSearch');
        const emptyState = document.getElementById('emptyState');
        const contentCard = document.getElementById('contentCard');

        function renderSidebar() {
            sidebarList.innerHTML = '';
            for (const [category, items] of Object.entries(groupedData)) {
                if (items.length === 0) continue;
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'cat-group';
                
                const header = document.createElement('div');
                header.className = 'cat-header';
                header.textContent = category;
                groupDiv.appendChild(header);
                
                items.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'vuln-item';
                    el.textContent = item.sub_name;
                    el.dataset.id = item.id;
                    el.dataset.search = item.searchStr;
                    
                    el.onclick = () => selectItem(el, item);
                    groupDiv.appendChild(el);
                });
                
                sidebarList.appendChild(groupDiv);
            }
            document.getElementById('countHeader').textContent = `${totalItems} Test Cases Loaded`;
        }

        function selectItem(element, item) {
            document.querySelectorAll('.vuln-item').forEach(e => e.classList.remove('active'));
            element.classList.add('active');
            
            emptyState.style.display = 'none';
            contentCard.style.display = 'block';
            
            document.getElementById('cardTitle').textContent = item.sub_name;
            document.getElementById('cardBadge').textContent = item.category;
            document.getElementById('cardDesc').innerHTML = item.description;
            document.getElementById('cardLoc').innerHTML = item.location;
            document.getElementById('cardBurp').textContent = item.burp;
            document.getElementById('cardRem').innerHTML = item.remediation;
            
            document.querySelector('.main-content').scrollTop = 0;
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const groups = document.querySelectorAll('.cat-group');
            
            groups.forEach(group => {
                let hasVisibleChild = false;
                const items = group.querySelectorAll('.vuln-item');
                
                items.forEach(item => {
                    if (item.dataset.search.includes(term)) {
                        item.classList.remove('hidden');
                        hasVisibleChild = true;
                    } else {
                        item.classList.add('hidden');
                    }
                });
                
                group.querySelector('.cat-header').style.display = hasVisibleChild ? 'block' : 'none';
            });
        });

        // Initialize App
        renderSidebar();
    </script>
</body>
</html>
